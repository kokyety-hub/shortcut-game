<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>SHORTCUT</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
body {
    color: #00ff00;
    font-family: monospace;
    text-align: center;
    padding-top: 100px;
    position: relative; 
    margin: 0;
}

body::before {
    content: "";
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    
    
    background-image: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), url('bg.jpg');
    background-size: 70%;
    background-position: center;
    
    /* التغميش هنا بس */
    filter: blur(4px); 
    
    /* عشان تبقى ورا الكلام */
    z-index: -1; 
}


        input {
            background: black;
            color: #00ff00;
            border: 1px solid #00ff00;
            padding: 15px;
            width: 80%;
            max-width: 300px;
            font-family: monospace;
            font-size: 18px;
        }

        button {
            background: black;
            color: #00ff00;
            border: 1px solid #00ff00;
            padding: 15px 25px;
            margin-top: 15px;
            cursor: pointer;
            font-family: monospace;
        }

        #result {
            margin-top: 40px;
            font-size: 20px;
        }
    </style>
</head>

<body>

    <h1>SHORTCUT.exe</h1>
    <p dir="rtl" style="font-size: 20px; color: #ffffff; line-height: 1.6; max-width: 600px; margin: 15px auto;">
        ازيكم احنا فريق shortcut عاملين ليكم اللعبة دي عشان نوصلكم رسالة من اية جميلة❤️ اكتب shortcut اللي تحبها و استني الاية اللي هتجيلك...❤️
    </p>
    <p>What's your shortcut?</p>

    <!-- استخدام form مخصص لمنع مشكلة الآيفون نهائياً -->
    <form onsubmit="checkShortcut(event)">
        <input
            type="text"
            id="shortcut"
            placeholder="Type your shortcut..."
            enterkeyhint="go"
            autocomplete="off"
        >
        <br>
        <button type="submit">ENTER</button>
    </form>

    <div id="result"></div>

    <script>
        let level = 0;

        function checkShortcut(event) {
            // منع الـ Refresh ومسح الحروف في الآيفون
            if (event) {
                event.preventDefault();
            }

            let shortcutInput = document.getElementById("shortcut");
            let shortcut = shortcutInput.value;

            if (shortcut.trim() === "") {
                alert("Type a shortcut first!");
                return;
            }

            level++;

            if (level === 1) {
                document.getElementById("result").innerHTML =
                    "<p>الرَّبُّ رَاعِيَّ فَلَا يُعْوِزُنِي شَيْءٌ. مز1:23</p>" +
                    "<p>Ready for the next shortcut?</p>";
            }
            else if (level === 2) {
                document.getElementById("result").innerHTML =
                    "<p>سَلاَمًا أَتْرُكُ لَكُمْ. سَلاَمِي أُعْطِيكُمْ. يوحنا 14: 27</p>" +
                    "<p>One more shortcut...</p>";
            }
            else if (level === 3) {
                document.getElementById("result").innerHTML =
                    "<p>أَنَا هُوَ نُورُ الْعَالَمِ. يوحنا 8: 12</p>" +
                    "<p>🎉 You found the final shortcut!</p>";
            }

            shortcutInput.value = "";
            shortcutInput.blur()
        }
    </script>

</body>
</html>
