<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>SHORTCUT</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
body {
    color: #00ff00;
    font-family: monospace;
    text-align: center;
    padding-top: 100px;
    margin: 0;
    min-height: 100vh; 
    position: relative;
    background-color: black; 
    padding:0;
    overflow: hidden;
}
body::before {
    content: "";           /* 👈 ده السطر السحري اللي مخليها متبانش! */
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    width: 100%;
    height: 100%;
    
    background-image: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), url('bg.jpg');
    background-size: 60%; 
    background-position: center;
    background-repeat: repeat;  /*منغير الاسود*/
    
    filter: blur(2px);
    transform: scale(1.2);
    z-index: -1;
}
#result {
    width: 85%;
    max-width: 650px;
    margin: 15px auto;
    padding: 15px;
    font-size: 1.2rem;
    line-height: 1.8;
    word-wrap: break-word;
    overflow-wrap: break-word;
    box-sizing: border-box;
}

#result p {
    margin: 0;
    padding: 0;
    direction: rtl;
    text-align: center;
    unicode-bidi: isolate;
    font-weight: 800;
    -webkit-text-stroke: 0.5px;
    text-shadow: 0.2px 0.2px 0px currentColor;
}
        input {
            background: black;
            color: #00ff00;
            border: 1px solid #00ff00;
            padding: 15px;
            width: 80%;
            max-width: 300px;
            font-family: Arial, sans-serif;
            font-size:18px;
        
        }

        button {
            background: black;
            color: #00ff00;
            border: 1px solid #00ff00;
            padding: 15px 25px;
            margin-top: 15px;
            cursor: pointer;
            font-family: monospace;
        }

        #result {
            margin-top: 40px;
            font-size: 20px;
        }
    </style>
</head>

<body>

    <h1>SHORTCUT.exe</h1>
    <p dir="rtl" style="font-size: 20px; color: #ffffff; line-height: 1.6; max-width: 600px; margin: 15px auto;">
        ازيكم احنا فريق shortcut عاملين ليكم اللعبة دي عشان نوصلكم رسالة من اية جميلة❤️ اكتب shortcut اللي تحبها و استني الاية اللي هتجيلك...❤️
    </p>
    <p style="font-size:24px;font-weight:bold;""> What's your shortcut?</p>

    <!-- استخدام form مخصص لمنع مشكلة الآيفون نهائياً -->
    <form onsubmit="checkShortcut(event)">
        <input
            type="text"
            id="shortcut"
            placeholder="Type your shortcut..."
            enterkeyhint="go"
            autocomplete="off"
            value="CTRL +"
        >
        <br>
        <button type="submit">ENTER</button>
    </form>

 <div id="result" dir="rtl"></div>
<script>
      const versesMap = {
    'z': 'تُوبُونِي فَأَتُوبَ.<br><small>(سفر إرميا 31: 18)</small>',
    'b': 'لاَ أُهْمِلُكَ وَلاَ أَتْرُكُكَ.<br><small>(سفر يشوع 1: 5)</small>',
    'w': 'كَمَا كُنْتُ مَعَ مُوسَى أَكُونُ مَعَكَ.<br><small>(سفر يشوع 1: 5)</small>',
    'r': 'الرَّبُّ رَاعِيَّ فَلاَ يَعْوِزُنِي شَيْءٌ.<br><small>(سفر المزامير 23: 1)</small>',
    's': 'سَلاَمًا أَتْرُكُ لَكُمْ. سَلاَمِي أُعْطِيكُمْ.<br><small>(إنجيل يوحنا 14: 27)</small>',
    'c': 'طُوبَى لِلرَّجُلِ الَّذِي يَتَّكِلُ عَلَى الرَّبِّ.<br><small>(سفر إرميا 17: 7)</small>',
    'm': 'اَللَّهُ مَحَبَّةٌ.<br><small>(رسالة يوحنا الأولى 4: 8)</small>',
    'f': [
        'وَتَطْلُبُونَنِي فَتَجِدُونَنِي إِذْ تَطْلُبُونَنِي بِكُلِّ قَلْبِكُمْ.<br><small>(سفر إرميا 29: 13)</small>',
        'وَأَمَّا طَالِبُو الرَّبِّ فَلاَ يُعْوِزُهُمْ شَيْءٌ مِنَ الْخَيْرِ.<br><small>(سفر المزامير 34: 10)</small>',
        'أُطْلُبُوا الرَّبَّ مَا دَامَ يُوجَدُ. ادْعُوهُ وَهُوَ قَرِيبٌ.<br><small>(سفر إشعياء 55: 6)</small>',
        'أَنْ يَطْلُبُوا الرَّبَّ لَعَلَّهُمْ يَتَلَمَّسُونَهُ فَيَجِدُوهُ.<br><small>(سفر أعمال الرسل 17: 27)</small>'
    ]
};
    
document.getElementById("shortcut").addEventListener("input", function() {
    if (!this.value.toUpperCase().startsWith("CTRL +")) {
        this.value = "CTRL + ";
    }
});
    function checkShortcut(event) {
        // منع الـ Refresh ومسح الحروف في الآيفون (موجودة وزي ما هي)
        if (event) {
            event.preventDefault();
        }

        let shortcutInput = document.getElementById("shortcut");
        let rawInput = shortcutInput.value.trim();

        if (rawInput === "") {
            alert("Type a shortcut first!");
            return;
        }

        // استخراج أول حرف واختيار الآية المناسبة
      let typedText = rawInput.replace(/CTRL/i, "").replace(/\+/g, "").trim();
    let firstChar = typedText.charAt(0).toLowerCase();

    let versesList = versesMap[firstChar];
    let selectedVerse = "";

    if (versesList && versesList.length > 0) {
        if (Array.isArray(versesList)) {
            let randomIndex = Math.floor(Math.random() * versesList.length);
            selectedVerse = versesList[randomIndex];
        } else {
            selectedVerse = versesList;
        }
    } else {
        selectedVerse = "جرب حروف من الـ shortcuts";
    }

    document.getElementById("result").innerHTML = "<p>" + selectedVerse + "</p>";

    shortcutInput.value = "CTRL +";
    shortcutInput.blur();
    }
        shortcutInput.value = "";
        shortcutInput.blur(); // إغلاق الكيبورد في الآيفون والأنresponsible
</script>
</body>
</html>
