<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>SHORTCUT</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
body {
    color: #00ff00;
    font-family: monospace;
    text-align: center;
    padding-top: 100px;
    margin: 0;
    min-height: 100vh; 
    position: relative;
    background-color: black; 
    padding:0;
    overflow: hidden;
}
body::before {
    content: "";           /* 👈 ده السطر السحري اللي مخليها متبانش! */
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    width: 100%;
    height: 100%;
    
    background-image: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), url('bg.jpg');
    background-size: 60%; 
    background-position: center;
    background-repeat: repeat;  /*منغير الاسود*/
    
    filter: blur(2px);
    transform: scale(1.2);
    z-index: -1;
}
        input {
            background: black;
            color: #00ff00;
            border: 1px solid #00ff00;
            padding: 15px;
            width: 80%;
            max-width: 300px;
            font-family: Arial, sans-serif;
            font-size:18px;
        
        }

        button {
            background: black;
            color: #00ff00;
            border: 1px solid #00ff00;
            padding: 15px 25px;
            margin-top: 15px;
            cursor: pointer;
            font-family: monospace;
        }

        #result {
            margin-top: 40px;
            font-size: 20px;
        }
    </style>
</head>

<body>

    <h1>SHORTCUT.exe</h1>
    <p dir="rtl" style="font-size: 20px; color: #ffffff; line-height: 1.6; max-width: 600px; margin: 15px auto;">
        ازيكم احنا فريق shortcut عاملين ليكم اللعبة دي عشان نوصلكم رسالة من اية جميلة❤️ اكتب shortcut اللي تحبها و استني الاية اللي هتجيلك...❤️
    </p>
    <p style="font-size:24px;font-weight:bold;""> What's your shortcut?</p>

    <!-- استخدام form مخصص لمنع مشكلة الآيفون نهائياً -->
    <form onsubmit="checkShortcut(event)">
        <input
            type="text"
            id="shortcut"
            placeholder="Type your shortcut..."
            enterkeyhint="go"
            autocomplete="off"
            value="CTRL +"
        >
        <br>
        <button type="submit">ENTER</button>
    </form>

    <div id="result"></div>
<script>
    // 1. قاموس الحروف والآيات
    const versesMap = {
        'Z': 'توبني ',
        'b': 'لا اهملك ولا اتركك',
        'w': 'كما كنت مع موسي اكون معك',
        'r': 'الرَّبُّ رَاعِيَّ فَلَا يُعْوِزُنِي شَيْءٌ. (مز 23: 1)',
        's': 'سَلاَمًا أَتْرُكُ لَكُمْ. سَلاَمِي أُعْطِيكُمْ. (يوحنا 14: 27)',
        'c': 'طوبي للرجل',
        'm': 'الله محبة',
        'f':[ 'وَتَطْلُبُونَنِي فَتَجِدُونَنِي إِذْ تَطْلُبُونَنِي بِكُلِّ قَلْبِكُمْ. (سفر إرميا13:29)',
             ' (سفر المزامير10:34) الأَشْبَالُ احْتَاجَتْ وَجَاعَتْ، وَأَمَّا طَالِبُو الرَّبِّ فَلاَ يُعْوِزُهُمْ شَيْءٌ مِنَ الْخَيْرِ' ,
            '(6 اُطْلُبُوا الرَّبَّ مَا دَامَ يُوجَدُ. ادْعُوهُ وَهُوَ قَرِيبٌ. (سفر إشعياء6:55',
            '(27 لِكَيْ يَطْلُبُوا اللهَ لَعَلَّهُمْ يَتَلَمَّسُونَهُ فَيَجِدُوهُ، مَعَ أَنَّهُ عَنْ كُلِّ وَاحِدٍ مِنَّا لَيْسَ بَعِيدًا. (سفر أعمال الرسل27:17'
        ]
    };
document.getElementById("shortcut").addEventListener("input", function() {
    if (!this.value.toUpperCase().startsWith("CTRL +")) {
        this.value = "CTRL + ";
    }
});
    function checkShortcut(event) {
        // منع الـ Refresh ومسح الحروف في الآيفون (موجودة وزي ما هي)
        if (event) {
            event.preventDefault();
        }

        let shortcutInput = document.getElementById("shortcut");
        let rawInput = shortcutInput.value.trim();

        if (rawInput === "") {
            alert("Type a shortcut first!");
            return;
        }

        // استخراج أول حرف واختيار الآية المناسبة
        let typedText = rawInput.replace(/^CTRL\s*\+\s*/i, "").trim();
        let firstChar = typedText.charAt(0).toLowerCase();
        let versesList = versesMap[firstChar];
let selectedVerse = "";

if (versesList && versesList.length > 0) {
    let randomIndex = Math.floor(Math.random() * versesList.length);
    selectedVerse = versesList[randomIndex];
}
if (selectedVerse) {
        document.getElementById("result").innerHTML = "<p>" + selectedVerse + "</p>";
    } else {
        document.getElementById("result").innerHTML = "<p>جرب حروف من ال shortcuts</p>";
    }

    shortcutInput.value = "CTRL +";
    shortcutInput.blur();
    }
        shortcutInput.value = "";
        shortcutInput.blur(); // إغلاق الكيبورد في الآيفون والأنresponsible
</script>
</body>
</html>
